[project]
name = "saferoute"
version = "1.0.0"
description = "Рабочее место оператора «Безопасный маршрут»: просмотр, сравнение и запуск прогонов amr-sim"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "black>=24.0", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["saferoute*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP031"]  # %-форматирование оставлено как в модуле разбора АРМ

[tool.pytest.ini_options]
testpaths = ["tests"]
